<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>op_daily 統合ダッシュボード</title>
    <!-- Chart.js & Supabase & DataLabels -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "HarmonyOS Sans SC", "Hiragino Sans", "Noto Sans SC", sans-serif;
            background: #f4f6fa;
            padding: 28px 24px;
            color: #1e293b;
            font-size: 14px;
        }
        .container { max-width: 1440px; margin: 0 auto; }
        .unit {
            background: white;
            border-radius: 16px;
            border: 1px solid #e9edf4;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            padding: 20px 24px 24px 24px;
            margin-bottom: 28px;
        }
        .unit-title {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f4f9;
        }
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 20px;
            margin-bottom: 18px;
        }
        .control-bar label { font-weight: 500; color: #334155; font-size: 14px; }
        .control-bar select, .control-bar input {
            padding: 7px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: white;
            color: #1e293b;
            transition: border-color 0.2s;
        }
        .control-bar select { width: 120px; cursor: pointer; }
        .control-bar input { width: 160px; }
        .control-bar select:focus, .control-bar input:focus {
            outline: none;
            border-color: #6d7f96;
            box-shadow: 0 0 0 3px rgba(59, 74, 102, 0.10);
        }
        .control-bar button {
            padding: 7px 22px;
            background: #3b4a66;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            letter-spacing: 0.3px;
        }
        .control-bar button:hover { background: #2d3a52; }
        .control-bar .spacer { flex: 1; }

        .doubleChartGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chartBox {
            background: #f8fafc;
            padding: 16px 16px 10px 16px;
            border-radius: 12px;
            border: 1px solid #eef2f7;
            height: 460px;
            display: flex;
            flex-direction: column;
        }
        .chartBox .chartHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 4px;
            gap: 8px;
        }
        .chartBox .chartHeader h4 {
            font-size: 15px;
            font-weight: 600;
            color: #1e3b5a;
            margin: 0;
            letter-spacing: 0.2px;
        }
        .chartBox .chartHeader select {
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 20px;
            padding: 4px 16px 4px 14px;
            font-size: 13px;
            font-family: inherit;
            color: #1e293b;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .chartBox .chartHeader select:hover { border-color: #6d7f96; }
        .chartBox .canvasWrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        .chartBox canvas { width: 100% !important; height: 100% !important; max-height: 380px; }
        .legend-inline {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding-top: 6px;
            font-size: 12px;
            color: #2c3e50;
        }
        .legend-inline span { display: flex; align-items: center; gap: 4px; }
        .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: #f8fafc;
            padding: 18px 16px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eef2f7;
            transition: box-shadow 0.2s;
        }
        .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card .label {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .card .big {
            font-size: 30px;
            font-weight: 700;
            color: #1e3b5a;
            margin-top: 4px;
            line-height: 1.2;
        }
        .card .sub {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 3px;
        }
        .card .sub .num { font-weight: 600; color: #1e293b; }

        .sectionTitle {
            font-size: 15px;
            font-weight: 600;
            color: #1e3b5a;
            margin-top: 0;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .tableWrapper {
            overflow-x: auto;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #eef2f7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 720px;
        }
        th {
            background: #f1f4f9;
            color: #1e293b;
            font-weight: 600;
            padding: 10px 14px;
            text-align: center;
            border-bottom: 2px solid #dce2ec;
            font-size: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        td {
            padding: 9px 14px;
            text-align: center;
            border-bottom: 1px solid #eef2f7;
            color: #1e293b;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f1f4f9; }
        td:first-child { font-weight: 500; color: #1e3b5a; }
        .highlight-rate { font-weight: 600; color: #1e3b5a; }

        /* 電話量推移（折れ線） */
        .chartCard {
            background: #f8fafc;
            padding: 16px 16px 10px 16px;
            border-radius: 12px;
            border: 1px solid #eef2f7;
            height: 300px;
            display: flex;
            flex-direction: column;
            margin-top: 0;
        }
        .chartCard .sectionTitle { margin-top: 0; margin-bottom: 6px; }
        .chartCard .chartBody {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        .chartCard canvas { width: 100% !important; height: 100% !important; max-height: 240px; }

        .officeGrid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .officeCard {
            background: #f8fafc;
            padding: 12px 8px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #eef2f7;
            transition: box-shadow 0.2s;
        }
        .officeCard:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .officeCard div:first-child {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .officeCard div:last-child {
            font-size: 20px;
            font-weight: 700;
            color: #1e3b5a;
            margin-top: 3px;
        }

        .officeChartGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 12px;
        }
        .officeChartBox {
            background: #f8fafc;
            padding: 16px 16px 10px 16px;
            border-radius: 12px;
            border: 1px solid #eef2f7;
            height: 320px;
            display: flex;
            flex-direction: column;
        }
        .officeChartBox .chartHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .officeChartBox .chartHeader h4 {
            font-size: 14px;
            font-weight: 600;
            color: #1e3b5a;
            margin: 0;
        }
        .officeChartBox .canvasWrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        .officeChartBox canvas { width: 100% !important; height: 100% !important; max-height: 260px; }

        /* 開通メール件数チャート用 */
        .mailChartBox {
            background: #f8fafc;
            padding: 16px 16px 10px 16px;
            border-radius: 12px;
            border: 1px solid #eef2f7;
            height: 320px;
            display: flex;
            flex-direction: column;
        }
        .mailChartBox .chartHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .mailChartBox .chartHeader h4 {
            font-size: 15px;
            font-weight: 600;
            color: #1e3b5a;
            margin: 0;
            letter-spacing: 0.2px;
        }
        .mailChartBox .canvasWrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        .mailChartBox canvas { width: 100% !important; height: 100% !important; max-height: 260px; }

        @media (max-width: 1100px) {
            .doubleChartGrid { grid-template-columns: 1fr; }
            .officeChartGrid { grid-template-columns: 1fr; }
            .officeGrid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .dashboard { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .chartBox { height: 400px; }
            .chartCard { height: 260px; }
            .officeChartBox { height: 280px; }
            .mailChartBox { height: 280px; }
            .officeGrid { grid-template-columns: repeat(3, 1fr); }
            .unit { padding: 16px; }
            .control-bar { flex-direction: column; align-items: stretch; }
            .control-bar input, .control-bar select { width: 100%; }
        }
        @media (max-width: 480px) {
            .dashboard { grid-template-columns: 1fr; }
            .officeGrid { grid-template-columns: 1fr 1fr; }
            .chartBox { height: 340px; }
            .chartCard { height: 220px; }
            .officeChartBox { height: 240px; }
            .mailChartBox { height: 240px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ============================================================ -->
    <!-- 新規：開通メール件数（固定データ） -->
    <!-- ============================================================ -->
    <div class="unit">
        <div class="unit-title">📧 開通メール件数</div>
        <div class="mailChartBox">
            <div class="chartHeader"><h4>📧 月別開通メール件数</h4></div>
            <div class="canvasWrap"><canvas id="mailChart"></canvas></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ユニット1：📅 年度 + 月次電話量 + 各項目個別 -->
    <!-- ============================================================ -->
    <div class="unit">
        <div class="unit-title">📊 チャート分析</div>
        <div class="control-bar">
            <label for="yearSelect">📅 年度</label>
            <select id="yearSelect">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
            <button onclick="loadYearData()">表示</button>
            <span class="spacer"></span>
            <span style="font-size:13px; color:#94a3b8;">年度選択して「表示」をクリック</span>
        </div>

        <div class="doubleChartGrid">
            <!-- 左：月次電話量（棒グラフ＋折れ線二軸・上下分離） -->
            <div class="chartBox">
                <div class="chartHeader"><h4>📞 月次電話量</h4></div>
                <div class="canvasWrap" style="display:flex; flex-direction:column; gap:6px;">
                    <!-- 上段：接続率・有効接続率 折れ線（右軸） -->
                    <div style="flex:1; position:relative; min-height:0; height:45%;">
                        <canvas id="chartRateTrend"></canvas>
                    </div>
                    <!-- 下段：月次電話量 積上げ棒グラフ（左軸） -->
                    <div style="flex:1; position:relative; min-height:0; height:45%;">
                        <canvas id="chartTotal"></canvas>
                    </div>
                </div>
                <div class="legend-inline">
                    <span><span class="color-dot" style="background:#4a7b9e;"></span> 不备</span>
                    <span><span class="color-dot" style="background:#b8a5d9;"></span> 开通</span>
                    <span><span class="color-dot" style="background:#6e8b7a;"></span> 商店街</span>
                    <span><span class="color-dot" style="background:#c97a5a;"></span> スタートダッシュ</span>
                    <span style="margin-left:8px;">— <span style="color:#d97706;">接続率</span> / <span style="color:#7c3aed;">有効接続率</span></span>
                </div>
            </div>

            <!-- 右：各項目個別 -->
            <div class="chartBox">
                <div class="chartHeader">
                    <h4>📊 各項目個別</h4>
                    <select id="catSelect">
                        <option value="fubi_total">不备电话量</option>
                        <option value="kaitsu">开通电话量</option>
                        <option value="yokohama">商店街</option>
                        <option value="start_dash">スタートダッシュ</option>
                    </select>
                </div>
                <div class="canvasWrap"><canvas id="chartRatio"></canvas></div>
                <div class="legend-inline" style="justify-content:flex-end; padding-top:4px;">
                    <span style="font-size:12px; color:#64748b;">選択項目の月次件数</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 事務作業統計（月次） 2つのチャート -->
    <!-- ============================================================ -->
    <div class="unit">
        <div class="unit-title">📋 事務作業統計（月次）</div>
        <div class="officeChartGrid">
            <div class="officeChartBox">
                <div class="chartHeader"><h4>📋 リスト更新系</h4></div>
                <div class="canvasWrap"><canvas id="officeChart1"></canvas></div>
            </div>
            <div class="officeChartBox">
                <div class="chartHeader"><h4>📋 その他事務作業</h4></div>
                <div class="canvasWrap"><canvas id="officeChart2"></canvas></div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ユニット2：オペレーションデータ -->
    <!-- ============================================================ -->
    <div class="unit">
        <div class="unit-title">📋 オペレーションデータ</div>

        <div class="control-bar">
            <label for="month">📅 月份</label>
            <input type="month" id="month">
            <button onclick="loadByMonth()">月別表示</button>
            <span class="spacer"></span>
            <span style="font-size:13px; color:#94a3b8;">選択月のデータを表示</span>
        </div>

        <div class="dashboard">
            <div class="card"><div class="label">着電数</div><div class="big" id="inbound">0</div></div>
            <div class="card"><div class="label">電話発信完了数</div><div class="big" id="totalCalls">0</div></div>
            <div class="card">
                <div class="label">接続数</div>
                <div class="big" id="connected">0</div>
                <div class="sub">接続率 <span class="num" id="rate">0%</span></div>
            </div>
            <div class="card">
                <div class="label">有効接続数</div>
                <div class="big" id="answered">0</div>
                <div class="sub">有効接続率 <span class="num" id="validRate">0%</span></div>
            </div>
        </div>

        <div class="sectionTitle">👤 OP別</div>
        <div class="tableWrapper">
            <table>
                <thead><tr><th>OP</th><th>着電数</th><th>電話発信完了数</th><th>接続数</th><th>有効接続数</th><th>接続率</th><th>有効接続率</th></tr></thead>
                <tbody id="opTable"></tbody>
            </table>
        </div>

        <!-- 電話量推移 (折れ線) -->
        <div style="margin-top:20px;">
            <div class="chartCard">
                <div class="sectionTitle">📈 電話量推移 (件数)</div>
                <div class="chartBody"><canvas id="callChart"></canvas></div>
            </div>
        </div>

        <div style="margin-top:20px;">
            <div class="sectionTitle">📋 事務作業統計（集計）</div>
            <div class="officeGrid" id="officeStats"></div>
        </div>
    </div>

</div>

<script>
    // ============================================================
    // Supabase 設定
    // ============================================================
    const SUPABASE_URL = "https://ieijoczgnndiqmowadty.supabase.co"
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllaWpvY3pnbm5kaXFtb3dhZHR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMDM4MzksImV4cCI6MjA4ODc3OTgzOX0.vkhnClBek5ZZvJfW9fZwRpKnAVRViTd3EJOsWOJNuwg"
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    Chart.register(ChartDataLabels);

    // ============================================================
    // 計算定義
    // ============================================================
    const calcDef = {
        total_year: (r) => Number(r.kaitsu||0) + Number(r.fubi||0) + Number(r.issuer_fubi||0) +
                   Number(r.yokohama||0) + Number(r.first_payment||0) + Number(r.month3||0) +
                   Number(r.month6||0) + Number(r.month12||0) + Number(r.condition||0),
        fubi_total: (r) => Number(r.fubi||0) + Number(r.issuer_fubi||0),
        kaitsu: (r) => Number(r.kaitsu||0),
        yokohama: (r) => Number(r.yokohama||0),
        start_dash: (r) => Number(r.first_payment||0) + Number(r.month3||0) + Number(r.month6||0) +
                   Number(r.month12||0) + Number(r.condition||0)
    };
    const monthLabels = ["3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

    // ============================================================
    // グローバル変数
    // ============================================================
    let callChart = null, chartTotal = null, chartRateTrend = null, chartRatio = null;
    let officeChart1 = null, officeChart2 = null;
    let mailChart = null;
    let currentMonthlyData = [];
    let currentYear = '2026';
    let allDataCache = {};

    // ============================================================
    // 開通メール件数チャート（固定データ）
    // ============================================================
    function renderMailChart() {
        const mailLabels = ["1月","2月","3月","4月","5月","6月","7月","8月"];
        const mailData = [29, 35, 33, 46, 33, 29, 40, 35];
        const maxVal = Math.max(...mailData, 0);
        const suggestedMax = maxVal > 0 ? Math.ceil(maxVal / 10) * 10 + 10 : 50;

        if (mailChart) mailChart.destroy();
        const ctx = document.getElementById('mailChart').getContext('2d');
        mailChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: mailLabels,
                datasets: [{
                    label: '開通メール件数',
                    data: mailData,
                    backgroundColor: '#2d7d9a',
                    borderColor: '#1a5a72',
                    borderWidth: 1,
                    borderRadius: 6,
                    barPercentage: 0.6,
                }]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        backgroundColor: 'rgba(30,40,55,0.9)',
                        titleColor: '#f0f4fe',
                        bodyColor: '#f0f4fe',
                        cornerRadius: 8,
                        padding: 10,
                        callbacks: {
                            label: function(context) {
                                return '開通メール件数: ' + context.raw + '件';
                            }
                        }
                    },
                    legend: { display: false },
                    datalabels: {
                        color: '#1e293b',
                        font: { weight: '700', size: 12, family: "'HarmonyOS Sans SC',sans-serif" },
                        formatter: (v) => v > 0 ? v : '',
                        anchor: 'end',
                        align: 'end',
                        offset: 0,
                        clamp: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: suggestedMax,
                        grid: { color: '#e2e8f0' },
                        title: { display: false },
                        ticks: { font: { size: 11 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 12, weight: '500' } }
                    }
                }
            }
        });
    }

    // ============================================================
    // 事務作業統計（詳細用）
    // ============================================================
    function createOfficeStats() {
        return {
            list_kaitsu: { name: "開通リスト更新", val: 0 },
            list_fubi: { name: "不備リスト更新", val: 0 },
            card: { name: "取引先屋号作成", val: 0 },
            issuer1: { name: "イシュア不備（一次対応）", val: 0 },
            ms: { name: "イシュア不備（M&S）", val: 0 },
            mail_list: { name: "メルマガリスト", val: 0 },
            mail_app: { name: "メルマガアプリ登録", val: 0 },
            promo: { name: "販促物リスト作成", val: 0 },
            sf: { name: "SF売り上げ導入", val: 0 },
            olc: { name: "OLC決済突合", val: 0 },
            haneda_cs: { name: "羽田業務CS", val: 0 },
            haneda_trans: { name: "羽田業務レポート", val: 0 },
            jb: { name: "ジェイブリッツ案件", val: 0 }
        };
    }

    function renderOffice(stats) {
        const order = ['list_kaitsu','list_fubi','card','issuer1','ms','mail_list','mail_app','promo','sf','olc','haneda_cs','haneda_trans','jb'];
        let html = '';
        for (const k of order) {
            if (stats[k]) {
                html += `<div class="officeCard"><div>${stats[k].name}</div><div>${stats[k].val}</div></div>`;
            }
        }
        document.getElementById('officeStats').innerHTML = html;
    }

    // ============================================================
    // 月度データ集計（電話量＋事務作業用）
    // ============================================================
    function aggregateMonthlyDataFull(rows) {
        const monthlyMap = {};
        rows.forEach(r => {
            if (!r.date) return;
            const d = new Date(r.date);
            const month = d.getMonth() + 1;
            if (month < 3 || month > 12) return;
            const key = String(month);
            if (!monthlyMap[key]) {
                monthlyMap[key] = {
                    kaitsu:0, fubi:0, issuer_fubi:0, yokohama:0,
                    first_payment:0, month3:0, month6:0, month12:0, condition:0,
                    calls:0, conn:0, ans:0,
                    list_kaitsu:0, list_fubi:0, card:0, issuer1:0, ms:0,
                    mail_list:0, mail_app:0, promo:0, sf:0, olc:0,
                    haneda_cs:0, haneda_trans:0, jb:0
                };
            }
            const m = monthlyMap[key];
            m.kaitsu += Number(r.kaitsu||0);
            m.fubi += Number(r.fubi||0);
            m.issuer_fubi += Number(r.issuer_fubi||0);
            m.yokohama += Number(r.yokohama||0);
            m.first_payment += Number(r.first_payment||0);
            m.month3 += Number(r.month3||0);
            m.month6 += Number(r.month6||0);
            m.month12 += Number(r.month12||0);
            m.condition += Number(r.condition||0);
            m.calls += calcDef.total_year(r);
            m.conn += Number(r.inbound_connect || 0);
            m.ans += (Number(r.kaitsu_answered||0) + Number(r.fubi_answered||0) + Number(r.issuer_fubi_answered||0) +
                      Number(r.yokohama_answered||0) + Number(r.first_payment_answered||0) + Number(r.month3_answered||0) +
                      Number(r.month6_answered||0) + Number(r.month12_answered||0) + Number(r.condition_answered||0));
            m.list_kaitsu += Number(r.list_kaitsu||0);
            m.list_fubi += Number(r.list_fubi||0);
            m.card += Number(r.card||0);
            m.issuer1 += Number(r.issuer1||0);
            m.ms += Number(r.ms||0);
            m.mail_list += Number(r.mail_list||0);
            m.mail_app += Number(r.mail_app||0);
            m.promo += Number(r.promo||0);
            m.sf += Number(r.sf||0);
            m.olc += Number(r.olc||0);
            m.haneda_cs += Number(r.haneda_cs||0);
            m.haneda_trans += Number(r.haneda_trans||0);
            m.jb += Number(r.jb||0);
        });
        const result = [];
        for (let m = 3; m <= 12; m++) {
            const key = String(m);
            result.push(monthlyMap[key] || {
                kaitsu:0, fubi:0, issuer_fubi:0, yokohama:0,
                first_payment:0, month3:0, month6:0, month12:0, condition:0,
                calls:0, conn:0, ans:0,
                list_kaitsu:0, list_fubi:0, card:0, issuer1:0, ms:0,
                mail_list:0, mail_app:0, promo:0, sf:0, olc:0,
                haneda_cs:0, haneda_trans:0, jb:0
            });
        }
        return result;
    }

    // ============================================================
    // 年度データ読み込み
    // ============================================================
    async function loadYearData() {
        const year = document.getElementById('yearSelect').value;
        currentYear = year;
        const startStr = year + '-01-01', endStr = year + '-12-31';
        const { data, error } = await supabaseClient
            .from('op_daily')
            .select('*')
            .gte('date', startStr)
            .lte('date', endStr);
        if (error) { console.error('データ取得エラー:', error); return; }
        allDataCache[year] = data || [];
        const monthlyData = aggregateMonthlyDataFull(allDataCache[year]);
        currentMonthlyData = monthlyData;

        renderChart1(monthlyData);
        renderRateTrend(monthlyData);
        renderChart2(monthlyData, document.getElementById('catSelect').value);
        renderOfficeCharts(monthlyData);
    }

    // ============================================================
    // 図1-下段：月次電話量（積上げ） - 开通ラベンダー、％非表示、件表示削除
    // 調整: 上部ラベルが切れないよう y 軸 max に余裕を持たせる
    // ============================================================
    function renderChart1(data) {
        const ds = data || currentMonthlyData;
        const hasData = ds.length > 0 && ds.some(r => (r.kaitsu+r.fubi+r.issuer_fubi+r.yokohama+r.first_payment+r.month3+r.month6+r.month12+r.condition) > 0);
        const dsFubiTotal = ds.map(r => r.fubi + r.issuer_fubi);
        const dsKaitsu    = ds.map(r => r.kaitsu);
        const dsYokohama  = ds.map(r => r.yokohama);
        const dsStartDash = ds.map(r => r.first_payment + r.month3 + r.month6 + r.month12 + r.condition);
        const totalArr    = ds.map(r => r.calls || (r.kaitsu+r.fubi+r.issuer_fubi+r.yokohama+r.first_payment+r.month3+r.month6+r.month12+r.condition));

        if (chartTotal) chartTotal.destroy();
        const ctx = document.getElementById('chartTotal').getContext('2d');
        const colorSet = ['#4a7b9e', '#b8a5d9', '#6e8b7a', '#c97a5a'];
        const borderSet = ['#2a5f7a', '#9a87c0', '#4e6e5e', '#a86040'];
        const maxVal = Math.max(...totalArr, 0);
        // 上部ラベルが切れないよう +20% 余裕を持たせる
        const suggestedMax = maxVal > 0 ? Math.ceil(maxVal * 1.25 / 50) * 50 + 50 : 100;

        const totalLabels = {
            id: 'totalLabels',
            afterDatasetsDraw: function(chart) {
                const ctx2 = chart.ctx;
                const meta = chart.getDatasetMeta(0);
                if (!meta.data || meta.data.length === 0) return;
                meta.data.forEach((bar, index) => {
                    const total = totalArr[index] || 0;
                    if (total === 0) return;
                    const x = bar.x;
                    const y = chart.scales.y.getPixelForValue(total) - 8;
                    ctx2.save();
                    ctx2.textAlign = 'center';
                    ctx2.textBaseline = 'bottom';
                    ctx2.font = '600 12px "HarmonyOS Sans SC", sans-serif';
                    ctx2.fillStyle = '#1e293b';
                    ctx2.fillText(total, x, y);
                    ctx2.restore();
                });
            }
        };

        chartTotal = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: monthLabels,
                datasets: hasData ? [
                    { label: '不备电话量', data: dsFubiTotal, backgroundColor: colorSet[0], borderColor: borderSet[0], borderWidth: 0.5 },
                    { label: '开通电话量', data: dsKaitsu,    backgroundColor: colorSet[1], borderColor: borderSet[1], borderWidth: 0.5 },
                    { label: '商店街',     data: dsYokohama,  backgroundColor: colorSet[2], borderColor: borderSet[2], borderWidth: 0.5 },
                    { label: 'スタートダッシュ', data: dsStartDash, backgroundColor: colorSet[3], borderColor: borderSet[3], borderWidth: 0.5 }
                ] : [
                    { label: 'データなし', data: Array(10).fill(0), backgroundColor: '#e2e8f0', borderColor: '#cbd5e1', borderWidth: 0.5 }
                ]
            },
            plugins: [ChartDataLabels, totalLabels],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        backgroundColor: 'rgba(30,40,55,0.9)',
                        titleColor: '#f0f4fe',
                        bodyColor: '#f0f4fe',
                        cornerRadius: 8,
                        padding: 10,
                        callbacks: {
                            label: function(context) {
                                const val = Number(context.raw);
                                const monthIdx = context.dataIndex;
                                const monthTotal = totalArr[monthIdx] || 0;
                                const pct = monthTotal === 0 ? 0 : ((val / monthTotal) * 100).toFixed(1);
                                return `${context.dataset.label}: ${val} (${pct}%)`;
                            }
                        }
                    },
                    legend: { display: false },
                    datalabels: { display: false }
                },
                scales: {
                    x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11, weight: '500' } } },
                    y: {
                        stacked: true, beginAtZero: true, max: suggestedMax,
                        grid: { color: '#e2e8f0' },
                        title: { display: false },
                        ticks: { display: false }
                    }
                }
            }
        });
    }

    // ============================================================
    // 図1-上段：接続率・有効接続率 折れ線（右軸） - 軸ラベル・目盛り非表示
    // ============================================================
    function renderRateTrend(data) {
        const ds = data || currentMonthlyData;
        const rateValues = ds.map(r => r.calls === 0 ? 0 : Math.round(r.conn / r.calls * 100));
        const validRateValues = ds.map(r => r.calls === 0 ? 0 : Math.round(r.ans / r.calls * 100));

        if (chartRateTrend) chartRateTrend.destroy();
        const ctx = document.getElementById('chartRateTrend').getContext('2d');
        chartRateTrend = new Chart(ctx, {
            type: 'line',
            data: {
                labels: monthLabels,
                datasets: [
                    { label: '接続率 (%)', data: rateValues, borderColor: '#d97706', backgroundColor: 'rgba(217,119,6,0.1)',
                      borderWidth: 3, pointBackgroundColor: '#d97706', pointBorderColor: 'white', pointBorderWidth: 1.5,
                      pointRadius: 4, tension: 0.3, fill: false, yAxisID: 'y1' },
                    { label: '有効接続率 (%)', data: validRateValues, borderColor: '#7c3aed', backgroundColor: 'rgba(124,58,237,0.1)',
                      borderWidth: 3, pointBackgroundColor: '#7c3aed', pointBorderColor: 'white', pointBorderWidth: 1.5,
                      pointRadius: 4, tension: 0.3, fill: false, yAxisID: 'y1' }
                ]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        backgroundColor: 'rgba(30,40,55,0.9)',
                        titleColor: '#f0f4fe',
                        bodyColor: '#f0f4fe',
                        cornerRadius: 8,
                        padding: 10,
                        callbacks: { label: (c) => c.dataset.label + ': ' + c.raw + '%' }
                    },
                    legend: { display: false },
                    datalabels: {
                        color: '#1e293b',
                        font: { weight: '600', size: 9, family: "'HarmonyOS Sans SC',sans-serif" },
                        formatter: (v) => v > 0 ? v + '%' : '',
                        anchor: 'end', align: 'end', offset: 2, clamp: true
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 10, weight: '500' } } },
                    y1: {
                        beginAtZero: true, position: 'right',
                        grid: { color: '#e2e8f0' },
                        title: { display: false },
                        ticks: { display: false },
                        min: 0, max: 100,
                    }
                },
                interaction: { intersect: false, mode: 'index' }
            }
        });
    }

    // ============================================================
    // 図2：各項目個別（軸ラベル・目盛り非表示）
    // ============================================================
    function renderChart2(data, catKey) {
        const ds = data || currentMonthlyData;
        const hasData = ds.length > 0 && ds.some(r => (r.kaitsu+r.fubi+r.issuer_fubi+r.yokohama+r.first_payment+r.month3+r.month6+r.month12+r.condition) > 0);
        const map = {
            fubi_total: (r) => r.fubi + r.issuer_fubi,
            kaitsu: (r) => r.kaitsu,
            yokohama: (r) => r.yokohama,
            start_dash: (r) => r.first_payment + r.month3 + r.month6 + r.month12 + r.condition
        };
        const countData = hasData ? ds.map(map[catKey]) : Array(10).fill(0);
        const nameMap = { fubi_total: '不备电话量', kaitsu: '开通电话量', yokohama: '商店街', start_dash: 'スタートダッシュ' };
        const colorMap = { fubi_total: '#4a7b9e', kaitsu: '#b8a5d9', yokohama: '#6e8b7a', start_dash: '#c97a5a' };
        const mainColor = hasData ? (colorMap[catKey] || '#6b7f8f') : '#cbd5e1';
        const maxVal = Math.max(...countData, 0);
        const suggestedMax = maxVal > 0 ? Math.ceil(maxVal / 50) * 50 + 50 : 100;

        if (chartRatio) chartRatio.destroy();
        const ctx = document.getElementById('chartRatio').getContext('2d');
        chartRatio = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: monthLabels,
                datasets: [{
                    label: hasData ? `${nameMap[catKey]} 件数` : 'データなし',
                    data: countData,
                    backgroundColor: mainColor,
                    borderColor: mainColor,
                    borderWidth: 0.5,
                    borderRadius: 6,
                    barPercentage: 0.65,
                }]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: { backgroundColor: 'rgba(30,40,55,0.9)', titleColor: '#f0f4fe', bodyColor: '#f0f4fe',
                        cornerRadius: 8, padding: 10,
                        callbacks: { label: (c) => hasData ? `${c.dataset.label}: ${c.raw}` : 'データなし' } },
                    legend: { display: false },
                    datalabels: {
                        color: '#1e293b', font: { weight: '600', size: 11, family: "'HarmonyOS Sans SC',sans-serif" },
                        formatter: (v) => hasData && v > 0 ? v : '',
                        anchor: 'end', align: 'end', offset: 0, clamp: true
                    }

                scales: {
                    y: {

                        grid: { color: '#e2e8f0' },

                        ticks: { display: false }
                    },

            }
        });
    }

    // ============================================================
    // 事務作業チャート（2つ） - リスト更新系に販促物リスト作成を追加、その他から削除

        const labels = monthLabels;

        // チャート1: 開通リスト更新, 不備リスト更新, メルマガリスト, 販促物リスト作成

        const d2 = ds.map(r => r.list_fubi || 0);
        const d3 = ds.map(r => r.mail_list || 0);
        const d_promo = ds.map(r => r.promo || 0);

        if (officeChart1) officeChart1.destroy();
        const ctx1 = document.getElementById('officeChart1').getContext('2d');
        officeChart1 = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: '開通リスト更新', data: d1, backgroundColor: '#4a7b9e', borderRadius: 4 },
                    { label: '不備リスト更新', data: d2, backgroundColor: '#b8a5d9', borderRadius: 4 },
                    { label: 'メルマガリスト', data: d3, backgroundColor: '#6e8b7a', borderRadius: 4 },
                    { label: '販促物リスト作成', data: d_promo, backgroundColor: '#d97706', borderRadius: 4 }
                ]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { boxWidth: 12, padding: 8, font: { size: 10 } } },

                        color: '#1e293b', font: { weight: '600', size: 9 },

                        anchor: 'end', align: 'end', offset: 0
                    }
                },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#e2e8f0' }, title: { display: false }, ticks: { display: false } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                }

        });

        // チャート2: 取引先屋号作成, メルマガアプリ登録, OLC決済突合, イシュア不備（一次対応）, イシュア不備（M&S）, ジェイブリッツ案件 (販促物削除)
        const d4 = ds.map(r => r.card || 0);
        const d5 = ds.map(r => r.mail_app || 0);
        const d7 = ds.map(r => r.olc || 0);
        const d8 = ds.map(r => r.issuer1 || 0);

            data: {

                    { label: 'メルマガアプリ登録', data: d5, backgroundColor: '#4a7b9e', borderRadius: 4 },
                    { label: 'OLC決済突合', data: d7, backgroundColor: '#6e8b7a', borderRadius: 4 },
                    { label: 'イシュア不備（一次）', data: d8, backgroundColor: '#d97706', borderRadius: 4 },
                    { label: 'イシュア不備（M&S）', data: d9, backgroundColor: '#7c3aed', borderRadius: 4 },

    // ============================================================
    // 電話量推移（折れ線） - 軸ラベル・目盛り非表示
    // ============================================================
    function drawCallChart(data) {
        let map = {};
        (data || []).forEach(r => {
            let calls = calcDef.total_year(r);
            if (!map[r.date]) map[r.date] = 0;
            map[r.date] += calls;
        });
        let labels = Object.keys(map).sort();
        let values = labels.map(k => map[k]);

        if (callChart) callChart.destroy();
        const ctx = document.getElementById('callChart').getContext('2d');
        callChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '電話発信完了数',
                    data: values,
                    borderColor: '#3b4a66',
                    backgroundColor: 'rgba(59, 74, 102, 0.1)',
                    borderWidth: 2.5,
                    tension: 0.3,
                    fill: true,
                    pointBackgroundColor: '#3b4a66',
                    pointBorderColor: 'white',
                    pointBorderWidth: 1.5,
                    pointRadius: 4
                }]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        color: '#1e293b', font: { weight: '600', size: 9 },
                        formatter: (v) => v > 0 ? v : '',
                        anchor: 'end', align: 'end', offset: 0
                    }
                },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#e2e8f0' }, title: { display: false }, ticks: { display: false } },
                    x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 30 } }
                }
            }
        });
    }

    // ============================================================
    // メイン描画（オペレーションデータ）
    // ============================================================
    function renderMain(data) {
        const rows = data || [];
        let officeStats = createOfficeStats();
        let inbound = 0, totalCalls = 0, connected = 0, answered = 0;
        let opMap = {};

        (rows || []).forEach(r => {
            const calls = calcDef.total_year(r);
            const validAns = (Number(r.kaitsu_answered||0) + Number(r.fubi_answered||0) + Number(r.issuer_fubi_answered||0) +
                              Number(r.yokohama_answered||0) + Number(r.first_payment_answered||0) + Number(r.month3_answered||0) +
                              Number(r.month6_answered||0) + Number(r.month12_answered||0) + Number(r.condition_answered||0));
            const inboundCall = Number(r.inbound_answered || 0);
            const conn = Number(r.inbound_connect || 0);

            inbound += inboundCall;
            totalCalls += calls;
            connected += conn;
            answered += validAns;

            if (!opMap[r.op_name]) opMap[r.op_name] = { inbound:0, calls:0, conn:0, ans:0 };
            opMap[r.op_name].inbound += inboundCall;
            opMap[r.op_name].calls += calls;
            opMap[r.op_name].conn += conn;
            opMap[r.op_name].ans += validAns;

            for (const k in officeStats) {
                officeStats[k].val += Number(r[k]) || 0;
            }
        });

        const rate = totalCalls ? Math.round(connected / totalCalls * 100) : 0;
        const validRate = totalCalls ? Math.round(answered / totalCalls * 100) : 0;

        document.getElementById('inbound').innerText = inbound;
        document.getElementById('totalCalls').innerText = totalCalls;
        document.getElementById('connected').innerText = connected;
        document.getElementById('answered').innerText = answered;
        document.getElementById('rate').innerText = rate + '%';
        document.getElementById('validRate').innerText = validRate + '%';

        let html = '';
        for (const op in opMap) {
            const i = opMap[op].inbound, c = opMap[op].calls, conn = opMap[op].conn, a = opMap[op].ans;
            const r = c ? Math.round(conn / c * 100) : 0;
            const vr = c ? Math.round(a / c * 100) : 0;
            html += `<tr><td>${op}</td><td>${i}</td><td>${c}</td><td>${conn}</td><td>${a}</td><td class="highlight-rate">${r}%</td><td class="highlight-rate">${vr}%</td></tr>`;
        }
        document.getElementById('opTable').innerHTML = html;
        renderOffice(officeStats);

        if (rows && rows.length > 0) drawCallChart(rows);
        else drawCallChart([]);
    }

    // ============================================================
    // 月別データ読み込み
    // ============================================================
    async function loadByMonth() {
        const month = document.getElementById('month').value;
        if (!month) return;
        const start = new Date(month + '-01');
        const end = new Date(start.getFullYear(), start.getMonth() + 1, 0);
        const startStr = start.toISOString().slice(0,10);
        const endStr = end.toISOString().slice(0,10);
        const { data } = await supabaseClient
            .from('op_daily')
            .select('*')
            .gte('date', startStr)
            .lte('date', endStr);
        renderMain(data || []);
    }

    // ============================================================
    // イベント
    // ============================================================
    document.getElementById('catSelect').addEventListener('change', function(e) {
        renderChart2(currentMonthlyData, e.target.value);
    });

    // ============================================================
    // 初期ロード
    // ============================================================
    window.onload = function() {
        const now = new Date();
        document.getElementById('month').value = now.toISOString().slice(0,7);
        renderMailChart(); // 開通メール件数チャートを描画
        loadYearData();
        loadByMonth();
    };
</script>
