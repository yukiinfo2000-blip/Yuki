<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合ダッシュボード</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- chartjs-plugin-datalabels -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', 'HarmonyOS Sans SC', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 1.5rem;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ===== 卡片通用 ===== */
        .card {
            background: #ffffff;
            border-radius: 1.2rem;
            box-shadow: 0 4px 20px rgba(0, 20, 40, 0.06), 0 1px 6px rgba(0, 0, 0, 0.02);
            padding: 1.6rem 1.8rem 1.8rem;
            border: 1px solid #eaeef4;
            margin-bottom: 1.4rem;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        /* ===== 头部通用 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #e8ecf2;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: 0.02em;
        }

        .header-left .badge {
            background: #eef1f6;
            padding: 0.1rem 1rem;
            border-radius: 40px;
            font-size: .75rem;
            color: #5a6f88;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        /* ===== 选择器 ===== */
        .selector-group {
            display: flex;
            align-items: center;
            gap: .4rem;
            background: #f5f7fa;
            padding: .15rem .6rem .15rem 1rem;
            border-radius: 60px;
            border: 1px solid #e2e6ed;
        }

        .selector-group label {
            font-weight: 500;
            color: #4a5f7a;
            font-size: .85rem;
        }

        .selector-group select {
            background: white;
            border: 1px solid #d5dce6;
            border-radius: 40px;
            padding: .25rem 1.2rem .25rem .8rem;
            font-weight: 500;
            font-size: .9rem;
            color: #2c3e50;
            outline: none;
            cursor: pointer;
            transition: .15s;
            appearance: auto;
        }

        .selector-group select:hover {
            border-color: #a8b8cc;
            background: #fafcff;
        }

        .selector-group select:focus {
            border-color: #7a8fa8;
            box-shadow: 0 0 0 3px rgba(60, 80, 110, .12);
        }

        .selector-group .range-label {
            color: #6a7f98;
            font-size: .85rem;
            font-weight: 400;
        }

        /* ===== 表格 ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 1rem;
            border: 1px solid #e8ecf2;
            background: #fbfcfe;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            min-width: 900px;
        }

        th {
            background: #f2f5f9;
            color: #3a4f6a;
            font-weight: 600;
            padding: .7rem .5rem;
            text-align: center;
            border-bottom: 2px solid #dce2ea;
            font-size: .85rem;
            white-space: nowrap;
        }

        td {
            padding: .5rem .3rem;
            text-align: center;
            border-bottom: 1px solid #eaeef4;
            color: #2c3e50;
            font-size: .85rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .category-header {
            background: #f0f3f8;
            font-weight: 600;
            color: #2c3e50;
            text-align: left;
            padding-left: 1rem;
            border-bottom: 1px solid #dce2ea;
            font-size: .9rem;
        }

        .sub-row td {
            background: #fafcfe;
            padding-left: 1.5rem;
            text-align: center;
        }

        .sub-row .label {
            text-align: left;
            padding-left: 1.8rem;
            color: #3a4f6a;
            font-weight: 450;
            font-size: .85rem;
        }

        .inquiry-num {
            font-weight: 600;
            color: #8a6d4b;
        }

        .default-num {
            font-weight: 500;
            color: #2c3e50;
        }

        .zero-value {
            color: #a8b8c8;
            font-weight: 400;
        }

        /* ===== 饼图网格 ===== */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: .3rem;
        }

        @media (max-width: 720px) {
            .chart-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        .chart-card {
            background: #fbfcfe;
            border-radius: 1.2rem;
            padding: 1rem 1rem 1.2rem;
            border: 1px solid #e8ecf2;
            transition: .15s;
        }

        .chart-card:hover {
            border-color: #d0d8e4;
            background: #fafcff;
        }

        .chart-card .card-header {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-weight: 600;
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: .4rem;
            padding-bottom: .2rem;
            border-bottom: 1px solid #e4eaf0;
        }

        .chart-card .card-header .badge {
            font-size: .65rem;
            background: #e8edf4;
            padding: .05rem .7rem;
            border-radius: 40px;
            font-weight: 400;
            color: #4a5f7a;
        }

        .chart-card .card-header .sub {
            font-size: .7rem;
            font-weight: 400;
            color: #6a7f98;
            margin-left: auto;
            background: #eef2f8;
            padding: .05rem .8rem;
            border-radius: 40px;
        }

        .chart-container {
            position: relative;
            height: 220px;
            max-height: 260px;
            margin: .1rem auto .3rem;
        }

        .chart-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .chart-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .2rem .8rem;
            margin-top: .3rem;
            font-size: .72rem;
            color: #3a4f6a;
        }

        .chart-footer .legend-item {
            display: flex;
            align-items: center;
            gap: .2rem;
        }

        .chart-footer .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 4px;
            display: inline-block;
        }

        /* ===== KPI 网格 ===== */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: .3rem;
        }

        @media (max-width: 860px) {
            .month-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 560px) {
            .month-grid {
                grid-template-columns: 1fr;
            }
        }

        .month-card {
            background: #fbfcfe;
            border-radius: 1.2rem;
            border: 1px solid #e8ecf2;
            padding: .8rem .6rem .6rem;
            transition: .15s;
        }

        .month-card:hover {
            border-color: #d0d8e4;
            background: #fafcff;
        }

        .month-card .month-title {
            font-weight: 600;
            font-size: 1rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: .2rem;
            padding-bottom: .2rem;
            border-bottom: 1px solid #e4eaf0;
        }

        .month-card .chart-container {
            height: 190px;
            max-height: 220px;
        }

        /* ===== 加载状态 ===== */
        .loading-overlay {
            text-align: center;
            padding: 1.5rem;
            color: #5a6f88;
            font-size: .9rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #e8ecf2;
            border-top-color: #5a7d9b;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-right: .6rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #c48a7a;
            background: #fdf0ed;
            padding: 0.8rem 1.2rem;
            border-radius: 0.8rem;
            text-align: center;
            font-size: .85rem;
        }

        .empty-state {
            color: #8a9aae;
            padding: 1.5rem;
            text-align: center;
            font-size: .85rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            body { padding: 0.8rem; }
            .card { padding: 1rem 0.8rem 1.2rem; border-radius: 1rem; }
            .header-left h1 { font-size: 1.1rem; }
            .selector-group { padding: .1rem .4rem .1rem .8rem; flex-wrap: wrap; }
            .selector-group select { padding: .15rem .6rem; font-size: .75rem; }
            .month-card .chart-container { height: 150px; }
            .chart-container { height: 170px; }
            .month-grid { gap: 0.6rem; }
            .chart-grid { gap: 1rem; }
            table { font-size: .7rem; min-width: 650px; }
            th, td { padding: .25rem .15rem; }
            .month-card .month-title { font-size: .85rem; }
            .chart-card .card-header { font-size: .85rem; }
        }

        .col-month { min-width: 40px; }
        .col-label { min-width: 110px; }
    </style>
</head>
<body>
    <div class="container">

    <script>
        // ================================================================
        // 🔧 Supabase 配置 - 请替换为你的实际值
        // ================================================================
        const SUPABASE_URL = 'https://ieijoczgnndiqmowadty.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllaWpvY3pnbm5kaXFtb3dhZHR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMDM4MzksImV4cCI6MjA4ODc3OTgzOX0.vkhnClBek5ZZvJfW9fZwRpKnAVRViTd3EJOsWOJNuwg';

        // ================================================================
        // 初始化 Supabase 客户端
        // ================================================================
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client initialized');
        } catch (e) {
            console.error('❌ Supabase initialization failed:', e);
        }

        // ================================================================
        // 颜色配置（日本商务风 · 沉稳典雅）
        // ================================================================
        const COLORS = {
            category: ['#6a8dab', '#b88a6b', '#7fa88a', '#9a7da8', '#c48a7a'],
            kpi: ['#6a8dab', '#7fa88a', '#b88a6b', '#9a7da8', '#c48a7a', '#7a9a9a', '#8a7a9a'],
            kpiBorder: ['#5a7d9b', '#6f9880', '#a87a5b', '#8a6d98', '#b47a6a', '#6a8a8a', '#7a6a8a'],
            bar: 'rgba(90, 125, 155, 0.7)',
            barBorder: '#5a7d9b'
        };

        const CATEGORIES = ['一般問い合わせ系', '決済・システム障害系', '商品・サービス品質系', '配送・受渡し系', '不正・詐欺・悪質取引系'];
        const KPI_LABELS = ['PMS作成', 'カスタマーサポート', 'インボイス連携', '販促物発注', 'Discover店舗ページ', 'クーポン登録', 'システムAPI更新'];
        const QUARTER_MAP = { Q1: [1, 2, 3], Q2: [4, 5, 6], Q3: [7, 8, 9], Q4: [10, 11, 12] };
        const DAYS_IN_MONTH = { 1:31, 2:28, 3:31, 4:30, 5:31, 6:30, 7:31, 8:31, 9:30, 10:31, 11:30, 12:31 };
        const TOTAL_MINUTES = 1920;

        // 存储图表实例
        const chartInstances = {};

        // ================================================================
        // 从Supabase获取数据
        // ================================================================
        async function fetchData() {
            if (!supabaseClient) {
                throw new Error('Supabase client not initialized.');
            }
            try {
                console.log('🔄 Fetching data from op_daily_work...');
                const { data, error } = await supabaseClient
                    .from('op_daily_work')
                    .select('*')
                    .order('work_date', { ascending: true });
                if (error) throw error;
                console.log(`✅ Fetched ${data ? data.length : 0} records`);
                return data;
            } catch (err) {
                console.error('❌ Data fetch failed:', err);
                throw err;
            }
        }

        // ================================================================
        // 销毁图表
        // ================================================================
        function destroyChart(key) {
            try {
                if (chartInstances[key] && typeof chartInstances[key].destroy === 'function') {
                    chartInstances[key].destroy();
                }
            } catch (e) { /* ignore */ }
            delete chartInstances[key];
        }

        function destroyAllCharts() {
            Object.keys(chartInstances).forEach(k => destroyChart(k));
        }

        // ================================================================
        // 模块1：苦情対応
        // ================================================================
        function aggregateByMonth(data, year) {
            const result = {};
            for (let m = 1; m <= 12; m++) {
                result[m] = { wechat_inquiry: 0, wechat_exchange: 0, wechat_store_confirm: 0, ali_inquiry: 0, ali_exchange: 0, ali_store_confirm: 0 };
            }
            if (!data) return result;
            data.forEach(row => {
                if (!row.work_date) return;
                try {
                    const date = new Date(row.work_date);
                    if (isNaN(date.getTime())) return;
                    if (date.getFullYear() !== year) return;
                    const m = date.getMonth() + 1;
                    result[m].wechat_inquiry += Number(row.wechat_inquiry_count) || 0;
                    result[m].wechat_exchange += Number(row.wechat_exchange_count) || 0;
                    result[m].wechat_store_confirm += Number(row.wechat_store_confirm_count) || 0;
                    result[m].ali_inquiry += Number(row.ali_inquiry_count) || 0;
                    result[m].ali_exchange += Number(row.ali_exchange_count) || 0;
                    result[m].ali_store_confirm += Number(row.ali_store_confirm_count) || 0;
                } catch (e) { /* ignore */ }
            });
            return result;
        }

        function renderBusinessTable(monthlyData) {
            const tbody = document.getElementById('tableBody');
            if (!monthlyData || Object.keys(monthlyData).length === 0) {
                tbody.innerHTML = `<tr><td colspan="13" class="empty-state">📭 データがありません</td></tr>`;
                return;
            }
            let html = '';
            // WechatPay
            html += `<tr class="category-header"><td colspan="13">💬 WechatPay</td></tr>`;
            html += `<tr class="sub-row"><td class="label">ユーザーから問合せ件数</td>`;
            for (let m = 1; m <= 12; m++) {
                const v = monthlyData[m] ? monthlyData[m].wechat_inquiry : 0;
                html += `<td class="${v === 0 ? 'zero-value' : 'inquiry-num'}">${v}</td>`;
            }
            html += `</tr>`;
            html += `<tr class="sub-row"><td class="label">ユーザーとやり取り件数</td>`;
            for (let m = 1; m <= 12; m++) {
                const v = monthlyData[m] ? monthlyData[m].wechat_exchange : 0;
                html += `<td class="${v === 0 ? 'zero-value' : 'default-num'}">${v}</td>`;
            }
            html += `</tr>`;
            html += `<tr class="sub-row"><td class="label">加盟店に確認件数</td>`;
            for (let m = 1; m <= 12; m++) {
                const v = monthlyData[m] ? monthlyData[m].wechat_store_confirm : 0;
                html += `<td class="${v === 0 ? 'zero-value' : 'default-num'}">${v}</td>`;
            }
            html += `</tr>`;
            // Alipay
            html += `<tr class="category-header" style="border-top:2px solid #dce2ea;"><td colspan="13">💳 Alipay</td></tr>`;
            html += `<tr class="sub-row"><td class="label">ユーザーから問合せ件数</td>`;
            for (let m = 1; m <= 12; m++) {
                const v = monthlyData[m] ? monthlyData[m].ali_inquiry : 0;
                html += `<td class="${v === 0 ? 'zero-value' : 'inquiry-num'}">${v}</td>`;
            }
            html += `</tr>`;
            html += `<tr class="sub-row"><td class="label">ユーザーとやり取り件数</td>`;
            for (let m = 1; m <= 12; m++) {
                const v = monthlyData[m] ? monthlyData[m].ali_exchange : 0;
                html += `<td class="${v === 0 ? 'zero-value' : 'default-num'}">${v}</td>`;
            }
            html += `</tr>`;
            html += `<tr class="sub-row"><td class="label">加盟店に確認件数</td>`;
            for (let m = 1; m <= 12; m++) {
                const v = monthlyData[m] ? monthlyData[m].ali_store_confirm : 0;
                html += `<td class="${v === 0 ? 'zero-value' : 'default-num'}">${v}</td>`;
            }
            html += `</tr>`;
            tbody.innerHTML = html;
        }

        // ================================================================
        // 模块2：カテゴリ別分布
        // ================================================================
        function aggregateCategoryByQuarter(data, quarter) {
            const months = QUARTER_MAP[quarter] || [4, 5, 6];
            const ali = {}, wechat = {};
            CATEGORIES.forEach(c => { ali[c] = 0; wechat[c] = 0; });
            if (!data) return { aliCategory: ali, wechatCategory: wechat };
            data.forEach(row => {
                if (!row.work_date) return;
                try {
                    const date = new Date(row.work_date);
                    if (isNaN(date.getTime())) return;
                    const m = date.getMonth() + 1;
                    if (!months.includes(m)) return;
                    const ac = row.ali_inquiry_category;
                    if (ac && ali[ac] !== undefined) ali[ac] += 1;
                    const wc = row.wechat_inquiry_category;
                    if (wc && wechat[wc] !== undefined) wechat[wc] += 1;
                } catch (e) { /* ignore */ }
            });
            return { aliCategory: ali, wechatCategory: wechat };
        }

        function renderCategoryChart(canvasId, legendId, labelId, categoryData, quarter) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const legendEl = document.getElementById(legendId);
            const labelEl = document.getElementById(labelId);
            if (labelEl) labelEl.textContent = quarter;

            const data = CATEGORIES.map(c => categoryData[c] || 0);
            const total = data.reduce((a, b) => a + b, 0);

            destroyChart(canvasId + 'Instance');

            let legendHtml = '';
            if (total === 0) {
                legendHtml = '<span class="empty-state">データなし</span>';
            } else {
                data.forEach((val, idx) => {
                    const pct = (val / total * 100);
                    legendHtml += `<span class="legend-item"><span class="color-dot" style="background:${COLORS.category[idx]};"></span>${CATEGORIES[idx]} ${pct.toFixed(1)}%</span>`;
                });
            }
            if (legendEl) legendEl.innerHTML = legendHtml;

            const chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: CATEGORIES,
                    datasets: [{ data: data, backgroundColor: COLORS.category, borderColor: '#ffffff', borderWidth: 2, hoverOffset: 8 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(c) {
                                    const t = c.dataset.data.reduce((a, b) => a + b, 0);
                                    const p = t === 0 ? 0 : (c.raw / t * 100);
                                    return `${c.label}: ${c.raw}件 (${p.toFixed(1)}%)`;
                                }
                            }
                        },
                        datalabels: {
                            display: function(c) { return c.dataset.data[c.dataIndex] > 0; },
                            color: '#ffffff',
                            font: { weight: '600', size: 11 },
                            formatter: function(v, c) {
                                const t = c.dataset.data.reduce((a, b) => a + b, 0);
                                if (t === 0 || v === 0) return '';
                                return (v / t * 100).toFixed(1) + '%';
                            },
                            anchor: 'center',
                            align: 'center'
                        }
                    },
                    cutout: '50%'
                },
                plugins: [ChartDataLabels]
            });
            chartInstances[canvasId + 'Instance'] = chart;
        }

        // ================================================================
        // 模块3：月次業務詳細
        // ================================================================
        function aggregateKPIByQuarter(data, quarter) {
            const months = QUARTER_MAP[quarter] || [4, 5, 6];
            const result = {};
            months.forEach(m => {
                result[m] = { pms: 0, customer_support: 0, invoice: 0, promo: 0, discover: 0, coupon: 0, wsystem: 0 };
            });
            if (!data) return result;
            data.forEach(row => {
                if (!row.work_date) return;
                try {
                    const date = new Date(row.work_date);
                    if (isNaN(date.getTime())) return;
                    const m = date.getMonth() + 1;
                    if (!months.includes(m)) return;
                    result[m].pms += Number(row.pms_count) || 0;
                    result[m].customer_support += (Number(row.wechat_exchange_count) || 0) + (Number(row.ali_exchange_count) || 0);
                    result[m].invoice += Number(row.invoice_count) || 0;
                    result[m].promo += Number(row.promo_count) || 0;
                    result[m].discover += Number(row.discover_count) || 0;
                    result[m].coupon += Number(row.coupon_count) || 0;
                    result[m].wsystem += Number(row.wsystem_count) || 0;
                } catch (e) { /* ignore */ }
            });
            return result;
        }

        function renderKPIs(quarterlyData, quarter) {
            const grid = document.getElementById('kpiMonthGrid');
            const months = QUARTER_MAP[quarter] || [4, 5, 6];

            // 清除旧图表（只清除kpi相关的）
            Object.keys(chartInstances).forEach(k => {
                if (k.startsWith('kpi_')) destroyChart(k);
            });

            if (!quarterlyData || Object.keys(quarterlyData).length === 0) {
                grid.innerHTML = '<div class="empty-state">📭 データがありません</div>';
                return;
            }

            grid.innerHTML = '';
            months.forEach(month => {
                const md = quarterlyData[month] || { pms: 0, customer_support: 0, invoice: 0, promo: 0, discover: 0, coupon: 0, wsystem: 0 };
                const values = [md.pms || 0, md.customer_support || 0, md.invoice || 0, md.promo || 0, md.discover || 0, md.coupon || 0, md.wsystem || 0];

                const card = document.createElement('div');
                card.className = 'month-card';
                const canvasId = `kpi_${month}`;
                card.innerHTML = `<div class="month-title">${month}月</div><div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
                grid.appendChild(card);

                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: KPI_LABELS,
                        datasets: [{
                            data: values,
                            backgroundColor: COLORS.kpi,
                            borderColor: COLORS.kpiBorder,
                            borderWidth: 1.5,
                            borderRadius: 4,
                            barPercentage: 0.6,
                            categoryPercentage: 0.7
                        }]
                    },
                    options: {
                        indexAxis: 'x',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { callbacks: { label: function(c) { return c.raw.toFixed(1); } } },
                            datalabels: {
                                anchor: 'end', align: 'end', color: '#3a4f6a',
                                font: { weight: '600', size: 8 },
                                formatter: function(v) { return v.toFixed(1); },
                                offset: 1
                            }
                        },
                        scales: {
                            y: { min: 0, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { color: '#6a7f98', stepSize: 1, font: { size: 9 } }, title: { display: false } },
                            x: { grid: { display: false }, ticks: { color: '#3a4f6a', font: { size: 8, weight: '500' }, maxRotation: 25, minRotation: 10 } }
                        },
                        layout: { padding: { top: 14, right: 4, bottom: 4, left: 4 } }
                    },
                    plugins: [ChartDataLabels]
                });
                chartInstances[canvasId] = chart;
            });
        }

        // ================================================================
        // 模块4：日次稼動率
        // ================================================================
        function collectDailyData(data, startMonth, endMonth) {
            const result = {};
            for (let m = startMonth; m <= endMonth; m++) result[m] = {};
            if (!data) return result;

            const timeFields = ['pms_time', 'invoice_time', 'promo_time', 'discover_time', 'coupon_time', 'wsystem_time', 'wechat_exchange_time', 'wechat_store_confirm_time', 'ali_exchange_time', 'ali_store_confirm_time'];

            data.forEach(row => {
                if (!row.work_date) return;
                try {
                    const date = new Date(row.work_date);
                    if (isNaN(date.getTime())) return;
                    const m = date.getMonth() + 1;
                    const d = date.getDate();
                    if (m < startMonth || m > endMonth) return;
                    let totalTime = 0;
                    timeFields.forEach(f => {
                        if (row[f] !== undefined && row[f] !== null) {
                            const v = Number(row[f]);
                            if (!isNaN(v)) totalTime += v;
                        }
                    });
                    const rate = Math.min(Math.max((totalTime / TOTAL_MINUTES) * 100, 0), 100);
                    result[m][d] = { day: d, totalTime: totalTime, rate: Math.round(rate * 10) / 10 };
                } catch (e) { /* ignore */ }
            });

            for (let m = startMonth; m <= endMonth; m++) {
                const sorted = {};
                Object.keys(result[m]).sort((a, b) => Number(a) - Number(b)).forEach(k => { sorted[k] = result[m][k]; });
                result[m] = sorted;
            }
            return result;
        }

        function renderDaily(monthlyData, startMonth, endMonth) {
            const grid = document.getElementById('dailyMonthGrid');

            Object.keys(chartInstances).forEach(k => {
                if (k.startsWith('daily_')) destroyChart(k);
            });

            let hasData = false;
            for (let m = startMonth; m <= endMonth; m++) {
                if (monthlyData[m] && Object.keys(monthlyData[m]).length > 0) { hasData = true; break; }
            }
            if (!hasData) {
                grid.innerHTML = '<div class="empty-state">📭 データがありません</div>';
                return;
            }

            grid.innerHTML = '';
            for (let m = startMonth; m <= endMonth; m++) {
                const monthData = monthlyData[m] || {};
                const sortedDays = Object.keys(monthData).sort((a, b) => Number(a) - Number(b));
                const filteredDays = sortedDays.filter(d => monthData[d].rate > 0);

                if (filteredDays.length === 0) {
                    const card = document.createElement('div');
                    card.className = 'month-card';
                    card.innerHTML = `<div class="month-title">${m}月</div><div class="empty-state" style="padding:0.3rem;font-size:0.8rem;">データなし</div>`;
                    grid.appendChild(card);
                    continue;
                }

                const labels = filteredDays.map(d => `${d}日`);
                const rates = filteredDays.map(d => monthData[d].rate);
                const times = filteredDays.map(d => monthData[d].totalTime);

                const card = document.createElement('div');
                card.className = 'month-card';
                const canvasId = `daily_${m}`;
                card.innerHTML = `<div class="month-title">${m}月</div><div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
                grid.appendChild(card);

                const canvas = document.getElementById(canvasId);
                if (!canvas) continue;
                const ctx = canvas.getContext('2d');

                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{ data: rates, backgroundColor: COLORS.bar, borderColor: COLORS.barBorder, borderWidth: 1.5, borderRadius: 3, barPercentage: 0.6 }]
                    },
                    options: {
                        indexAxis: 'x',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(c) {
                                        const idx = c.dataIndex;
                                        return `稼動率: ${c.raw.toFixed(1)}% (${times[idx] || 0}分)`;
                                    },
                                    title: function(items) { return items[0].label; }
                                }
                            },
                            datalabels: { display: false }
                        },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#6a7f98', font: { size: 8 }, maxTicksLimit: 31 } },
                            y: { min: 0, max: 50, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { stepSize: 10, color: '#6a7f98', font: { size: 8 }, callback: function(v) { return v + '%'; } }, title: { display: false } }
                        },
                        layout: { padding: { top: 14, right: 4, bottom: 4, left: 4 } }
                    },
                    plugins: [ChartDataLabels]
                });
                chartInstances[canvasId] = chart;
            }
        }

        // ================================================================
        // 主加载函数
        // ================================================================
        let cachedData = null;

        async function loadDashboard() {
            try {
                const data = await fetchData();
                cachedData = data;

                if (!data || data.length === 0) {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="13" class="empty-state">📭 データがありません</td></tr>`;
                    document.getElementById('alipayLegend').innerHTML = '<span class="empty-state">データなし</span>';
                    document.getElementById('wechatLegend').innerHTML = '<span class="empty-state">データなし</span>';
                    document.getElementById('kpiMonthGrid').innerHTML = '<div class="empty-state">📭 データがありません</div>';
                    document.getElementById('dailyMonthGrid').innerHTML = '<div class="empty-state">📭 データがありません</div>';
                    return;
                }

                // 模块1
                const year = parseInt(document.getElementById('yearSelect').value) || 2026;
                const monthlyData = aggregateByMonth(data, year);
                renderBusinessTable(monthlyData);

                // 模块2
                const quarter = document.getElementById('quarterSelect').value || 'Q2';
                const { aliCategory, wechatCategory } = aggregateCategoryByQuarter(data, quarter);
                renderCategoryChart('alipayChart', 'alipayLegend', 'alipayQuarterLabel', aliCategory, quarter);
                renderCategoryChart('wechatChart', 'wechatLegend', 'wechatQuarterLabel', wechatCategory, quarter);

                // 模块3
                const kpiQuarter = document.getElementById('kpiQuarterSelect').value || 'Q2';
                const kpiData = aggregateKPIByQuarter(data, kpiQuarter);
                renderKPIs(kpiData, kpiQuarter);

                // 模块4
                const start = parseInt(document.getElementById('monthStart').value) || 6;
                let end = parseInt(document.getElementById('monthEnd').value) || 8;
                if (end - start > 2) { end = start + 2; document.getElementById('monthEnd').value = end; }
                const dailyData = collectDailyData(data, start, end);
                renderDaily(dailyData, start, end);

                // ---- 绑定事件 ----
                // 模块1 年份切换
                document.getElementById('yearSelect').addEventListener('change', function() {
                    const y = parseInt(this.value);
                    const md = aggregateByMonth(cachedData, y);
                    renderBusinessTable(md);
                });

                // 模块2 季度切换
                document.getElementById('quarterSelect').addEventListener('change', function() {
                    const q = this.value;
                    const { aliCategory: ac, wechatCategory: wc } = aggregateCategoryByQuarter(cachedData, q);
                    renderCategoryChart('alipayChart', 'alipayLegend', 'alipayQuarterLabel', ac, q);
                    renderCategoryChart('wechatChart', 'wechatLegend', 'wechatQuarterLabel', wc, q);
                });

                // 模块3 季度切换
                document.getElementById('kpiQuarterSelect').addEventListener('change', function() {
                    const q = this.value;
                    const kd = aggregateKPIByQuarter(cachedData, q);
                    renderKPIs(kd, q);
                });

                // 模块4 月份切换
                document.getElementById('monthStart').addEventListener('change', function() {
                    let s = parseInt(this.value);
                    let e = parseInt(document.getElementById('monthEnd').value);
                    if (e - s > 2) { e = s + 2; document.getElementById('monthEnd').value = e; }
                    if (s > e) { [document.getElementById('monthStart').value, document.getElementById('monthEnd').value] = [e, s]; s = parseInt(document.getElementById('monthStart').value); e = parseInt(document.getElementById('monthEnd').value); }
                    const dd = collectDailyData(cachedData, s, e);
                    renderDaily(dd, s, e);
                });
                document.getElementById('monthEnd').addEventListener('change', function() {
                    let e = parseInt(this.value);
                    let s = parseInt(document.getElementById('monthStart').value);
                    if (e - s > 2) { s = e - 2; document.getElementById('monthStart').value = s; }
                    if (s > e) { [document.getElementById('monthStart').value, document.getElementById('monthEnd').value] = [e, s]; s = parseInt(document.getElementById('monthStart').value); e = parseInt(document.getElementById('monthEnd').value); }
                    const dd = collectDailyData(cachedData, s, e);
                    renderDaily(dd, s, e);
                });

                console.log('✅ 全てのダッシュボードが正常に読み込まれました');

            } catch (err) {
                console.error('❌ 加载失败:', err);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="13" class="error-message">⚠️ ${err.message}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('📋 DOM loaded, initializing dashboard...');
            loadDashboard();
        });
    </script>
</body>
</html>
